name: Build e Publicacao de Release (Windows e Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1A: COMPILAÇÃO WINDOWS
  # ============================================================================
  compilar_windows:
    runs-on: windows-latest
    steps:
      - name: Transferir codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pynput mss pillow google-genai pydantic markdown xhtml2pdf pyinstaller

      - name: Compilar Executavel Windows (.exe)
        run: |
          pyinstaller --noconsole --onefile --name "AutoDoc_IT_Windows" --collect-all customtkinter --collect-submodules pynput --collect-all xhtml2pdf --collect-submodules reportlab auto_doc.py

      - name: Guardar executavel Windows
        uses: actions/upload-artifact@v4
        with:
          name: pacote-Windows
          path: dist/AutoDoc_IT_Windows.exe

  # ============================================================================
  # JOB 1B: COMPILAÇÃO LINUX (RODANDO NO UBUNTU MAIS RECANTE E ESTÁVEL)
  # ============================================================================
  compilar_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Transferir codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias graficas do sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xdotool scrot binutils libgl1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pynput mss pillow google-genai pydantic markdown xhtml2pdf pyinstaller

      - name: Compilar Binario Linux
        run: |
          pyinstaller --noconsole --onefile --name "AutoDoc_IT_Linux" --collect-all customtkinter --collect-submodules pynput --collect-all xhtml2pdf --collect-submodules reportlab auto_doc.py

      - name: Guardar executavel Linux
        uses: actions/upload-artifact@v4
        with:
          name: pacote-Linux
          path: dist/AutoDoc_IT_Linux

  # ============================================================================
  # JOB 2: CRIAÇÃO AUTOMÁTICA DA RELEASE NA PÁGINA DO GITHUB
  # ============================================================================
  publicar_release:
    needs: [compilar_windows, compilar_linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Transferir os executaveis compilados
        uses: actions/download-artifact@v4
        with:
          path: arquivos_release
          merge-multiple: true

      - name: Criar Release no GitHub e anexar binarios
        uses: softprops/action-gh-release@v2
        with:
          name: "AutoDoc IT — Versão ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 🚀 AutoDoc IT (${{ github.ref_name }})
            Gravador inteligente de procedimentos e documentação técnica com Google Gemini 2.5 Flash.

            ### 📥 Transferências Diretas:
            * **Windows (10/11):** Transfira o ficheiro **`AutoDoc_IT_Windows.exe`** abaixo e execute.
            * **Linux:** Transfira o ficheiro **`AutoDoc_IT_Linux`**, dê permissão de execução (`chmod +x AutoDoc_IT_Linux`) e execute (`./AutoDoc_IT_Linux`).

            ---
            *© Desenvolvido por Raffael Dutra*
          files: |
            arquivos_release/AutoDoc_IT_Windows.exe
            arquivos_release/AutoDoc_IT_Linux